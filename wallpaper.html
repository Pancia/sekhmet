<!DOCTYPE html>
<!--
  The picture behind a gate. Framed into the gate rather than painted onto it by the
  content script, because the images live in extension storage and the obvious
  routes out of there - data: and blob: URLs - are both refused by openfront.io's
  img-src 'self'. An extension page is exempt from the host page's CSP, and can
  read storage itself.
-->
<html>
<head>
<meta charset="utf-8">
<style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body {
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0;
        transition: opacity 200ms ease;
    }
</style>
</head>
<body>
<script src="polyfill.js"></script>
<script src="wallpapers.js"></script>
<script src="wallpaper.js"></script>
</body>
</html>
